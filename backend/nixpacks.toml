# Nixpacks configuration for Railway
# This ensures only backend dependencies are installed

[phases.setup]
nixPkgs = ["nodejs-20_x", "npm"]

[phases.install]
cmds = [
  "npm ci --production=false --ignore-scripts",
  "npm run build"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start:prod"

