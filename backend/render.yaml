services:
  - type: web
    name: chatup-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: chatup-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chatup-postgres
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: chatup-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: chatup-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: chatup-postgres
          property: database

databases:
  - name: chatup-postgres
    plan: free
    databaseName: chatup
    user: admin

