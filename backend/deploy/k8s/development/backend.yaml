apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-go
  namespace: chatup-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend-go
  template:
    metadata:
      labels:
        app: backend-go
    spec:
      containers:
      - name: backend-go
        image: docker.io/marcotecmar/chatup-backend-go:b70c6fa48f7d
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgresql://admin:password@postgres:5432/chatup"
        - name: JWT_SECRET
          value: "dev-secret"
        - name: NODE_ENV
          value: "development"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-go
  namespace: chatup-dev
spec:
  selector:
    app: backend-go
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer # Para acesso externo no Rancher/K8s
