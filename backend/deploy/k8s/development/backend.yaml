apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatup-dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: chatup-backend:dev
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          value: "postgresql://admin:password@postgres:5432/chatup"
        - name: ELECTRIC_URL
          value: "http://electric:5133"
        - name: JWT_SECRET
          value: "dev-secret"
        - name: NODE_ENV
          value: "development"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatup-dev
spec:
  selector:
    app: backend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer # Para acesso externo no Rancher/K8s
