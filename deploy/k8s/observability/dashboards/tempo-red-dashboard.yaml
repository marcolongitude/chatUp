apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-red-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  tempo-red-overview.json: |
    {
      "id": null,
      "title": "Tempo - RED & Pipeline",
      "tags": ["chatup", "tempo", "tracing", "red"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Spans Received/s",
          "gridPos": {"x": 0, "y": 0, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(tempo_distributor_spans_received_total[1m]))",
              "legendFormat": "spans_in"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Discarded Spans/s by Reason",
          "gridPos": {"x": 8, "y": 0, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (reason) (rate(tempo_discarded_spans_total[5m]))",
              "legendFormat": "{{reason}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Discard Ratio (%)",
          "gridPos": {"x": 16, "y": 0, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "100 * sum(rate(tempo_discarded_spans_total[5m])) / clamp_min(sum(rate(tempo_distributor_spans_received_total[5m])), 1)",
              "legendFormat": "discard_pct"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "P95 Traces per Batch",
          "gridPos": {"x": 0, "y": 8, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum(rate(tempo_distributor_traces_per_batch_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Traces Created/s",
          "gridPos": {"x": 8, "y": 8, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(tempo_ingester_traces_created_total[1m]))",
              "legendFormat": "traces_created"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Live Traces (In-Memory)",
          "gridPos": {"x": 16, "y": 8, "w": 8, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(tempo_ingester_live_traces)",
              "legendFormat": "live_traces"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Tempo Inflight Requests by Route",
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (route) (tempo_inflight_requests)",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Distributor -> Ingester Appends/s",
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(rate(tempo_distributor_ingester_appends_total[1m]))",
              "legendFormat": "appends"
            }
          ]
        }
      ]
    }
