name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci --production=false
        env:
          NODE_ENV: production

      - name: Build
        working-directory: ./backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy Backend to Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        uses: bervProject/railway-deploy@v0.2.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_SERVICE_ID || 'backend' }}
          detach: false
        continue-on-error: true

      - name: Deploy Electric SQL to Railway
        if: ${{ secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_ELECTRIC_SERVICE_ID != '' }}
        uses: bervProject/railway-deploy@v0.2.0
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: ${{ secrets.RAILWAY_ELECTRIC_SERVICE_ID }}
          detach: false
        continue-on-error: true

      - name: Deploy to Render (Fallback)
        if: failure() && secrets.RENDER_API_KEY != ''
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
        continue-on-error: true

      - name: Deployment Status
        run: |
          echo "🚀 Deployment process finished"
          echo "✅ Backend deployment triggered"
          if [ "${{ secrets.RAILWAY_ELECTRIC_SERVICE_ID }}" != "" ]; then
            echo "✅ Electric SQL deployment triggered"
          fi
          echo "Check your Railway dashboard for real-time build progress"

