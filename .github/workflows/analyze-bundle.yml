name: Analyze Bundle Size

on:
    pull_request:
        branches:
            - developer
            - main
    push:
        branches:
            - developer
            - main
    workflow_dispatch: # Permite execução manual

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
    analyze:
        name: Analyze Bundle Size
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run bundle analysis
              run: npm run analyze:bundle

            - name: Check for large files
              run: |
                  echo "📊 Checking for large files..."
                  find assets -type f -size +500k -exec ls -lh {} \; || echo "No large files found"

            - name: Check dependencies
              run: |
                  echo "📦 Checking dependencies..."
                  npm ls --depth=0 || true

            - name: Comment PR (if PR)
              if: github.event_name == 'pull_request'
              continue-on-error: true
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      let comment = '## 📦 Bundle Size Analysis\n\n';
                      comment += '✅ Bundle analysis completed successfully!\n\n';
                      comment += '💡 **Recommendations:**\n';
                      comment += '- Review large assets (>500KB)\n';
                      comment += '- Check for unused dependencies\n';
                      comment += '- Optimize images before committing\n\n';
                      comment += 'Run `npm run analyze:bundle` locally for detailed analysis.';

                      github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: comment
                      });
